<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Launch film</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Colour tokens come from the look in film.config.js (set on #stage by film.js). */
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-x: hidden; }
body:not(.render) { padding: 12px 0 90px; }
#stage {
  position: relative; overflow: hidden; background: var(--ground); color: var(--ink);
  font-family: var(--body), system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
body:not(.render) #stage { transform-origin: top center; }
.layer { position: absolute; inset: 0; }
.abs { position: absolute; }
#bg { position: absolute; inset: 0; }

/* Words in masks: .wm clips, .wi moves. Accent words (written *like this* in the copy) carry the accent colour and a drifting sheen. */
.wm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.06em 0.2em; margin: -0.04em -0.06em -0.2em; }
.wm.open { overflow: visible; }
.wi { display: inline-block; transform-origin: 50% 100%; }
.display { font-family: var(--display), Georgia, serif; font-weight: var(--display-weight, 400); letter-spacing: -0.015em; line-height: 1.0; }
.acc { color: var(--acc); background: linear-gradient(100deg, var(--acc) 20%, var(--acc-hi) 50%, var(--acc) 80%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; padding-right: 0.06em; }
.italic-acc .acc { font-style: italic; }
.ln { display: block; white-space: nowrap; }
.center { text-align: center; }
.sub { font-family: var(--body); font-weight: 500; color: var(--sub); letter-spacing: -0.005em; }

/* Devices */
#world { position: absolute; inset: 0; perspective: 2800px; }
.phone { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.slab { position: absolute; inset: 0; }
.pbody { position: absolute; inset: 0; overflow: hidden; }
.glass { position: absolute; overflow: hidden; background: #000; }
.screen { position: absolute; inset: 0; overflow: hidden; background: var(--screen-bg); color: var(--screen-ink); font-family: var(--body); }
.sweep { position: absolute; inset: -20%; pointer-events: none; mix-blend-mode: screen; }
.island { position: absolute; background: #000; border-radius: 999px; z-index: 30; }
.browser { position: absolute; left: 0; top: 0; border-radius: 22px; overflow: hidden; background: var(--screen-bg); box-shadow: 0 40px 100px rgba(0,0,0,0.35), 0 0 0 1px rgba(127,127,127,0.25); }
.browser .chrome { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: var(--chrome-bg); }
.browser .dot { width: 13px; height: 13px; border-radius: 50%; }
.browser .url { margin-left: 18px; flex: 1; height: 30px; border-radius: 9px; background: var(--screen-bg); opacity: 0.8; font: 500 14px/30px var(--body); color: var(--screen-sub); padding: 0 14px; }

/* Placeholder screen UI (replace with the real product, rebuilt from its code) */
.ph-pad { position: absolute; left: 24px; right: 24px; }
.ph-card { background: var(--card); border-radius: 18px; padding: 16px 18px; box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 6px 18px rgba(0,0,0,0.05); }
.ph-kick { font: 700 12px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--screen-sub); }
.ph-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font: 500 16px/1.2 var(--body); }
.ph-row:first-child { border-top: 0; }
.ph-dot { width: 30px; height: 30px; border-radius: 10px; background: var(--acc); opacity: 0.85; flex: none; }
.ph-btn { height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font: 700 17px/1 var(--body); background: var(--screen-ink); color: var(--screen-bg); }
.tap { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(0,0,0,0.16); box-shadow: 0 0 0 2px rgba(255,255,255,0.6); z-index: 40; }

/* Feature wall */
.tile { position: absolute; border-radius: 44px; background: var(--tile); box-shadow: inset 0 0 0 1.5px var(--tile-line); overflow: hidden; }
.tile .lab { position: absolute; left: 38px; right: 30px; bottom: 34px; font: 700 40px/1.06 var(--body); letter-spacing: -0.02em; color: var(--ink); }
.tile .lab small { display: block; font: 500 26px/1.2 var(--body); color: var(--sub); letter-spacing: 0; margin-top: 8px; }
.tile .art { position: absolute; left: 38px; top: 38px; right: 38px; }

/* Preview controls (hidden when rendering) */
#ctl { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 14px 20px; background: #111; color: #ddd; font: 13px system-ui; z-index: 100; }
#ctl input[type=range] { flex: 1; }
body.render #ctl { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div></div>
<div id="ctl"><button id="pp">Play</button><input id="scrub" type="range" min="0" max="1" step="0.0001" value="0"><span id="tc">0.00s</span></div>
<script src="film.config.js"></script>
<script src="film.js"></script>
</body>
</html>
